<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#171334" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>시우의 피아노 연주 대회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#171334;
  --panel:#241E4D;
  --panel-2:#2F2760;
  --ink:#EFEBFF;
  --ink-dim:#A79FD6;
  --glow:#FFC857;
  --glow-deep:#B87F0C;
  --good:#5DCAA5;
  --miss:#F0997B;
  --ivory:#FFFDF7;
  --ebony:#120F28;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;
  background:radial-gradient(120% 90% at 50% 0%,#2A2360 0%,var(--night) 55%,#0E0B24 100%)}
body{color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#top{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:5px 7px 6px;position:relative;z-index:7;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));
  box-shadow:0 2px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}

.brand{font-family:Gaegu,"Noto Sans KR",sans-serif;font-weight:700;font-size:19px;color:var(--glow);padding-right:5px;white-space:pre;flex:0 0 auto;text-shadow:0 2px 0 #7A5208,0 3px 6px rgba(0,0,0,.5)}
.brand span{display:inline-block;transform-origin:50% 100%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{
  0%,62%,100%{transform:translateY(0) scale(1);color:var(--glow);text-shadow:none}
  14%{transform:translateY(-3px) scale(1.16);color:#FFF3D0;text-shadow:0 0 8px rgba(255,200,87,.9)}
  30%{transform:translateY(0) scale(1);color:var(--glow);text-shadow:none}}

button{font-family:inherit;color:var(--ink);border:1.5px solid transparent;border-radius:999px;padding:5px 12px;font-size:13px;line-height:1.35;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg,#2F2760 0%,#221C4B 100%);
  box-shadow:0 2px 0 #110D2A,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .08s,background .15s,box-shadow .08s}
button:active{transform:translateY(2px);box-shadow:0 0 0 #110D2A,0 1px 2px rgba(0,0,0,.4),inset 0 2px 4px rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
button.on{background:linear-gradient(180deg,#FFD978 0%,#FFB73A 100%);color:#3B2A00;font-weight:500;
  box-shadow:0 2px 0 #9A6208,0 3px 8px rgba(255,180,50,.35),inset 0 1px 0 rgba(255,255,255,.55)}
button.on:active{box-shadow:0 0 0 #9A6208,0 1px 2px rgba(0,0,0,.3),inset 0 2px 4px rgba(120,70,0,.35)}
button.ghost{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-color:rgba(167,159,214,.35);
  box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
button.ghost:active{box-shadow:0 0 0 rgba(0,0,0,.35),inset 0 2px 4px rgba(0,0,0,.4)}
.g{display:none}
body.guide .g{display:inline-block}
body.guide .spd,body.guide #rhythm,body.guide #score,body.guide #record,body.guide #demo{display:none}
.chip{font-family:Gaegu,"Noto Sans KR",sans-serif;font-size:17px;color:var(--glow);padding:4px 10px;border:1.5px solid rgba(167,159,214,.35);border-radius:999px;white-space:nowrap;min-width:52px;text-align:center;
  background:linear-gradient(180deg,#120F28,#1B1640);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06)}
.sep{width:1px;align-self:stretch;background:var(--panel-2);margin:2px 3px;flex:0 0 auto}

#stage{flex:1 1 auto;min-height:70%;position:relative;overflow:hidden;touch-action:none}
#piano{position:absolute;inset:0;touch-action:none;background:#0B0920}
#piano::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,#B03A2E 0%,#7A2219 60%,#4A120C 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.6)}
#piano::after{content:"";position:absolute;left:0;right:0;top:9px;height:22px;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0))}

#track{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.5);z-index:6;pointer-events:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
#fill{height:100%;width:0;background:linear-gradient(180deg,#8DEFC9,#3FB48C);box-shadow:0 0 8px rgba(93,202,165,.9);transition:width .18s}

#status{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:9px;max-width:92%;
  background:linear-gradient(180deg,rgba(60,50,110,.85),rgba(23,19,52,.9));border:1px solid rgba(167,159,214,.35);
  border-radius:999px;padding:3px 14px;backdrop-filter:blur(4px);
  box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
}
#msg{font-family:Gaegu,"Noto Sans KR",sans-serif;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg b{color:var(--glow);font-weight:700}
#tally{font-size:12px;color:var(--ink-dim);white-space:nowrap}

.key{position:absolute;top:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.lbl{position:relative;z-index:2}
.nt{position:absolute;left:2px;right:2px;z-index:1;border-radius:6px;pointer-events:none;display:none;
  background:linear-gradient(180deg,#FF9A3C 0%,#FF6A2A 100%);border:2px solid #FFF3D0;box-sizing:border-box;
  box-shadow:0 0 0 2px #B83A00,0 0 14px 3px rgba(255,120,40,.85),inset 0 -6px 10px rgba(0,0,0,.18)}
.nt::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.75)}
.nt.bk{left:1px;right:1px;background:linear-gradient(180deg,#FFF17A 0%,#FFC400 100%);box-shadow:0 0 0 2px #3A2A00,0 0 18px 5px rgba(255,220,80,1),inset 0 -6px 10px rgba(0,0,0,.15)}
.nt.near{animation:ntpulse .32s ease-in-out infinite alternate}
@keyframes ntpulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.nt.hold{background:var(--good);opacity:.9;box-shadow:0 0 10px rgba(93,202,165,.6)}
.b .w.ready{box-shadow:inset 0 0 0 3px var(--glow),0 0 14px rgba(255,200,87,.5)}
.b.ready{box-shadow:inset 0 0 0 2px var(--glow)}
.lbl{transition:transform .12s}
.lit .lbl{transform:scale(1.22)}
.w.lit,.b.lit{animation:beam .5s ease-in-out infinite alternate}
@keyframes beam{from{box-shadow:inset 0 0 0 0 rgba(255,255,255,0),0 0 6px rgba(255,200,87,.5)}
  to{box-shadow:inset 0 0 26px 7px rgba(255,255,255,.6),0 0 10px rgba(255,200,87,.7)}}
.ring{position:absolute;z-index:6;width:14px;height:14px;border-radius:50%;border:3px solid #FFF3D0;box-shadow:0 0 18px rgba(255,200,87,.95),inset 0 0 10px rgba(255,200,87,.8);pointer-events:none;animation:ripple .5s ease-out forwards}
@keyframes ripple{from{transform:translate(-50%,-50%) scale(.3);opacity:1}
  to{transform:translate(-50%,-50%) scale(9);opacity:0}}
.fw{position:absolute;z-index:8;width:var(--sz);height:var(--sz);border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor,0 0 14px currentColor,0 0 24px currentColor;pointer-events:none;animation:fw var(--dur) cubic-bezier(.12,.62,.32,1) forwards}
@keyframes fw{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
  55%{transform:translate(calc(-50% + var(--mx)),calc(-50% + var(--my))) scale(1.1);opacity:.95}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.25);opacity:0}}
.ring.gr{border-color:#DFFFF2;box-shadow:0 0 18px rgba(93,202,165,.95),inset 0 0 10px rgba(93,202,165,.85)}
.w.holding,.b.holding{animation:hold .42s ease-in-out infinite alternate}
@keyframes hold{from{box-shadow:inset 0 -16px 26px -8px rgba(93,202,165,.55),0 0 10px rgba(93,202,165,.5)}
  to{box-shadow:inset 0 -30px 40px -6px rgba(93,202,165,.95),0 0 26px rgba(93,202,165,.95)}}
.flash{position:absolute;z-index:7;width:26px;height:26px;border-radius:50%;background:#FFF8E4;box-shadow:0 0 26px 12px rgba(255,200,87,.9);pointer-events:none;animation:flash .32s ease-out forwards}
@keyframes flash{from{transform:translate(-50%,-50%) scale(.4);opacity:1}
  to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.w{background:linear-gradient(90deg,#E9E3D4 0%,#FFFDF7 9%,#FFFDF7 88%,#E4DECF 100%),var(--ivory);
  border:1px solid #B9B2A3;border-top:none;border-radius:0 0 9px 9px;color:#6C6455;padding-bottom:12px;
  box-shadow:inset 0 -9px 0 #CFC7B6,inset 0 -11px 0 rgba(0,0,0,.08),inset 2px 0 3px rgba(255,255,255,.7),inset -3px 0 4px rgba(0,0,0,.08),0 4px 0 #8E877A;
  transition:transform .05s,box-shadow .05s}
.w .lbl{text-shadow:0 1px 0 #fff}
.b{background:linear-gradient(90deg,#060414 0%,#201A44 18%,#2A2452 50%,#1A1538 82%,#050312 100%);
  z-index:3;border-radius:0 0 7px 7px;color:#9F97D0;padding-bottom:9px;
  box-shadow:inset 0 -7px 0 #0A0818,inset 0 -9px 0 rgba(255,255,255,.1),inset 0 3px 4px rgba(255,255,255,.08),0 6px 10px rgba(0,0,0,.7),0 2px 0 #000;
  transition:transform .05s,box-shadow .05s}
.b::before{content:"";position:absolute;left:22%;width:18%;top:0;bottom:20%;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 60%,rgba(255,255,255,0));pointer-events:none}
.w.hit{background:linear-gradient(90deg,#D9D2C1,#EFE8D8 10%,#EFE8D8 88%,#D4CDBC);transform:translateY(3px);
  box-shadow:inset 0 -5px 0 #CFC7B6,inset 0 3px 6px rgba(0,0,0,.18),inset 2px 0 3px rgba(255,255,255,.4),0 1px 0 #8E877A}
.b.hit{transform:translateY(3px);background:linear-gradient(90deg,#060414,#2A2452 30%,#352C66 50%,#241E4C 75%,#050312);
  box-shadow:inset 0 -4px 0 #0A0818,inset 0 3px 6px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.7)}
.w.lit{background:linear-gradient(90deg,#E59A1E 0%,#FFD16A 10%,#FFC24A 88%,#D98F14 100%);color:#3B2A00;border-color:var(--glow-deep);
  box-shadow:inset 0 -9px 0 #B87F0C,inset 0 -11px 0 rgba(0,0,0,.12),inset 2px 0 3px rgba(255,255,255,.6),0 4px 0 #7A5208}
.b.lit{background:linear-gradient(90deg,#B87F0C,#FFD16A 35%,#FFE49B 50%,#FFC24A 70%,#9A6208);color:#3B2A00;
  box-shadow:inset 0 -7px 0 #7A5208,inset 0 3px 4px rgba(255,255,255,.4),0 6px 10px rgba(0,0,0,.6)}
.w.good,.b.good{background:var(--good);color:#07402F}
.w.miss,.b.miss{background:var(--miss);color:#5B2107}

#cheer{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(23,19,52,.55);overflow:hidden;cursor:pointer}
#cheer.show{display:flex}
#cheerCard{position:relative;z-index:2;text-align:center;background:linear-gradient(180deg,#352C6A,#241E4D);border:2px solid var(--glow);border-radius:22px;padding:12px 30px 14px;
  box-shadow:0 0 0 4px rgba(255,200,87,.18),0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
#cheerStars{font-size:clamp(26px,7vh,44px);letter-spacing:4px;line-height:1;color:var(--glow);text-shadow:0 0 14px rgba(255,200,87,.8)}
#cheerStars .dim{color:var(--panel-2);text-shadow:none}
#cheerBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;pointer-events:auto}
#cheerBtns button{font-size:14px;padding:7px 16px}
#cheer{pointer-events:none}
#cheer.show{pointer-events:auto}
#cheerCard strong{display:block;font-family:Gaegu,"Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(26px,7vh,52px);line-height:1.1;color:var(--glow)}
#cheerCard small{display:block;margin-top:3px;font-size:clamp(11px,2vh,15px);color:var(--ink-dim)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.spark{position:absolute;top:-8%;font-size:22px;color:var(--glow);animation:drop 2.4s linear infinite}
.spark:nth-child(even){color:var(--good)}
@keyframes drop{0%{transform:translateY(-10%) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(115vh) rotate(420deg);opacity:0}}

#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,8,26,.72);padding:10px}
#modal.show{display:flex}
#sheet{width:100%;max-width:760px;max-height:94%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2A2360,#1F1948);border:1.5px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)}
#mHead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--panel-2)}
#mTitle{flex:1;text-align:center;font-family:Gaegu,"Noto Sans KR",sans-serif;font-size:22px;color:var(--glow)}
#mGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;
  padding:12px;overflow-y:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;
  background:linear-gradient(180deg,#352C6A 0%,#2A2358 100%);border:1.5px solid rgba(255,255,255,.06);border-radius:16px;cursor:pointer;
  color:var(--ink);font-family:inherit;transition:transform .1s,border-color .15s,box-shadow .1s;
  box-shadow:0 3px 0 #171334,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.card:active{transform:translateY(3px);box-shadow:0 0 0 #171334,0 2px 4px rgba(0,0,0,.45),inset 0 2px 5px rgba(0,0,0,.35)}
.card svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.card:hover,.card:focus-visible{border-color:var(--glow);outline:none}
.card svg{width:34px;height:34px;fill:var(--glow)}
.card b{font-size:14px;font-weight:500;line-height:1.25;text-align:center;word-break:keep-all}
.card small{font-size:11px;color:var(--ink-dim)}
.card.big svg{width:40px;height:40px;fill:var(--good)}
@media (max-height:430px){
  #mGrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:8px}
  .card{padding:8px 6px;gap:3px}
  .card svg{width:26px;height:26px}
  .card.big svg{width:30px;height:30px}
  .card b{font-size:13px}
  #mTitle{font-size:19px}
}
.grow{flex:1 1 auto;min-width:4px}
.rec{display:none}
body.record .rec{display:inline-block}
body.free #again,body.guide #demo,body.record #demo{display:none}
#settingsBtn{display:inline-flex;align-items:center;gap:5px}
#settings{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,8,26,.72);padding:10px}
#settings.show{display:flex}
#sheet2{width:100%;max-width:560px;max-height:94%;display:flex;flex-direction:column;background:linear-gradient(180deg,#2A2360,#1F1948);border:1.5px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)}
#mHead2{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--panel-2)}
#mTitle2{flex:1;text-align:center;font-family:Gaegu,"Noto Sans KR",sans-serif;font-size:22px;color:var(--glow)}
#sBody{overflow-y:auto;padding:4px 12px 10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--panel-2)}
.srow:last-child{border-bottom:0}
.slab{font-size:15px;color:var(--ink)}
.slab small{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.sgrp{display:flex;gap:5px;flex:0 0 auto}
@media (max-height:430px){.srow{padding:7px 2px}.slab{font-size:14px}.slab small{font-size:11px}}
#rotate{position:fixed;inset:0;background:var(--night);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#rotate.show{display:flex}
#rotate .ph{width:56px;height:94px;border:4px solid var(--glow);border-radius:12px;animation:tip 1.8s ease-in-out infinite}
@keyframes tip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{font-family:Gaegu,"Noto Sans KR",sans-serif;font-size:24px;margin:0}
#rotate small{color:var(--ink-dim);font-size:13px}
@media (prefers-reduced-motion:reduce){.brand span{animation:none}#rotate .ph{animation:none;transform:rotate(-90deg)}button:active{transform:none}.spark,.ring,.fw,.flash{display:none}.nt.near{animation:none}.w.holding,.b.holding{animation:none}#cheerCard{animation:none}.w.lit,.b.lit{animation:none;box-shadow:inset 0 0 20px 5px rgba(255,255,255,.5)}}

@media (max-height:430px){
  #top{gap:3px;padding:4px 6px 5px}
  .brand{font-size:16px}
  button{font-size:12px;padding:4px 10px}
  #msg{font-size:16px}
  #status{top:6px;padding:2px 11px}
}
@media (max-height:290px){
  .brand{display:none}
  button{font-size:11px;padding:3px 9px}
  #msg{font-size:15px}
}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div class="bar">
      <span class="brand">시우의 피아노 연주 대회</span>
      <button id="free" class="on">자유 연주</button>
      <button id="follow" class="ghost">따라하기</button>
      <button id="guide" class="ghost">연주 안내</button>
      <span class="sep"></span>
      <button id="demo" class="ghost">들려주기</button>
      <button id="again" class="ghost">처음부터</button>
      <button id="gPlay" class="g on">멈춤</button>
      <button id="gSlow" class="g ghost">느리게</button>
      <span id="gRate" class="g chip">1배</span>
      <button id="gFast" class="g ghost">빠르게</button>
      <button id="record" class="rec ghost">저장하기</button>
      <span class="grow"></span>
      <button id="settingsBtn" class="ghost" aria-label="설정"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 3.5c0-.5 0-1-.1-1.4l2-1.6-1.9-3.3-2.4 1a7.6 7.6 0 0 0-2.4-1.4L15.4 2h-3.8l-.4 2.6c-.9.3-1.7.8-2.4 1.4l-2.4-1-1.9 3.3 2 1.6c-.1.5-.1 1-.1 1.4s0 1 .1 1.4l-2 1.6 1.9 3.3 2.4-1c.7.6 1.5 1.1 2.4 1.4l.4 2.6h3.8l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.4 1 1.9-3.3-2-1.6c.1-.4.1-.9.1-1.4z"/></svg> 설정</button>
    </div>
  </div>

  <div id="settings">
    <div id="sheet2">
      <div id="mHead2"><span id="mTitle2">설정</span><button id="sClose" class="ghost">닫기</button></div>
      <div id="sBody">
        <div class="srow"><div class="slab">리듬 안내<small>노트가 내려오며 누를 때를 알려줘요</small></div><button id="rhythm" class="on">리듬 켜짐</button></div>

  b.innerHTML=svgIcon(ic)+"<b>"+label+"</b>"+(sub?"<small>"+sub+"</small>":"");
  b.onclick=fn;return b;
}

function showGenres(){

function showParts(){

  if(s.parts.length<2){choose(curSong,0);closePicker();return;}
  MTITLE.textContent=s.title;MBACK.style.visibility="visible";MBACK.onclick=showSongs;

  MGRID.appendChild(card("star","전곡",s.parts[last].n.length+"음",true,function(){choose(curSong,last);closePicker();}));

    if(i===last)return;
    MGRID.appendChild(card("note",pt.t,pt.n.length+"음",false,function(){choose(curSong,i);closePicker();}));
  });
}

function setRate(i){
  gRate=RATES[Math.max(0,Math.min(RATES.length-1,i))];

  audio();

  choose(i,SONGS[i].parts.length-1);

var GRID=[.25,.5,.75,1,1.5,2,3];
function snap(v){
  var best=GRID[0];
  for(var i=1;i<GRID.length;i++)if(Math.abs(GRID[i]-v)<Math.abs(best-v))best=GRID[i];
  return best;
}
function timesToBeats(ts){
  if(!ts||ts.length<2)return null;
  var gaps=[],i;
  for(i=1;i<ts.length;i++)gaps.push(Math.max(80,ts[i]-ts[i-1]));
  var sorted=gaps.slice().sort(function(a,b){return a-b;}),
      base=sorted[Math.floor(sorted.length/2)];
  if(!base)return null;
  var d=gaps.map(function(g){return snap(g/base*.5);});
  d.push(d.length?d[d.length-1]:.5);
  return d;
}
function saveMineDirect(notes,beats){
  var parts=[P("전곡",notes,beats)];
  var found=-1;SONGS.forEach(function(s,i){if(s.id==="mine")found=i;});
  var e={id:"mine",title:"내 곡",parts:parts};
  if(found>=0)SONGS[found]=e;else SONGS.push(e);
  buildIdx();
}
function saveMine(notes,ts){
  var beats=timesToBeats(ts),parts=[P("전곡",notes,beats)];
  var found=-1;
  SONGS.forEach(function(s,i){if(s.id==="mine")found=i;});
  var entry={id:"mine",title:"내 곡",parts:parts};
  if(found>=0)SONGS[found]=entry;else SONGS.push(entry);
  buildIdx();
  try{localStorage.setItem("kidsPianoMine",JSON.stringify({n:notes,d:beats}));}catch(e){}
}
try{
  var saved=localStorage.getItem("kidsPianoMine");
  if(saved){
    var o=JSON.parse(saved);
    if(o&&o.n&&o.n.length>1)saveMineDirect(o.n,o.d);
    else if(o&&o.length>1)saveMineDirect(o,null);
  }
}catch(e){}
document.getElementById("demo").onclick=function(){
  audio();
  if(songIdx<0){openPicker();return;}
  releaseAll();stopDemo();
  var list=seq.slice(),at=0,times=list.map(function(m,i){var t=at;at+=noteMs(dur[i])*.9;return t;});
  list.forEach(function(m,i){
    timers.push(setTimeout(function(){
      tone(m,Math.min(2,Math.max(.35,noteMs(dur[i])/1000*.95)));clearLit();keys[m].classList.add("lit");
      msg.innerHTML="듣는 중 · <b>"+NAME[m]+"</b>";
      tally.textContent=(i+1)+" / "+list.length;
      fill.style.width=Math.round((i+1)/list.length*100)+"%";
      if(i===list.length-1)timers.push(setTimeout(function(){step=0;stars=0;misses=0;feel="";render();},700));
    },times[i]));
  });
};

var rotate=document.getElementById("rotate"),dismissed=false;
document.getElementById("closeRotate").onclick=function(){dismissed=true;rotate.classList.remove("show");};
function hintIfPortrait(){
  var narrow=window.innerHeight>window.innerWidth;
  if(narrow&&!dismissed)rotate.classList.add("show");else rotate.classList.remove("show");
}

document.getElementById("wide").onclick=function(){
  closeSettings();audio();
  var btn=this;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(screen.orientation&&screen.orientation.unlock)try{screen.orientation.unlock();}catch(e){}
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    btn.textContent="가로로 크게";btn.className="ghost";return;
  }
  var el=document.documentElement;
  var req=el.requestFullscreen||el.webkitRequestFullscreen;
  var p=req?req.call(el):Promise.reject();
  Promise.resolve(p).then(function(){
    btn.textContent="원래 크기로";btn.className="on";
    if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock("landscape");
    throw new Error("no lock");
  }).catch(function(){dismissed=false;hintIfPortrait();});
};

(function waveTitle(){
  var el=document.querySelector(".brand");if(!el)return;
  var txt=el.textContent;el.textContent="";
  for(var i=0;i<txt.length;i++){
    var s=document.createElement("span");
    s.textContent=txt[i];
    s.style.animationDelay=(i*0.11).toFixed(2)+"s";
    el.appendChild(s);
  }
})();

})();
